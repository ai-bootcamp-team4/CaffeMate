substitutions:
  _REGION: asia-northeast3
  _AR_REPOSITORY: caffemate-backend
  _IMAGE_NAME: backend
  _API_SERVICE_NAME: caffemate-api
  _WORKER_SERVICE_NAME: caffemate-worker
  _MIGRATION_JOB_NAME: caffemate-migrate
  _API_RUNTIME_SERVICE_ACCOUNT: caffemate-api-runtime@${PROJECT_ID}.iam.gserviceaccount.com
  _WORKER_RUNTIME_SERVICE_ACCOUNT: caffemate-worker-runtime@${PROJECT_ID}.iam.gserviceaccount.com
  _MIGRATION_SERVICE_ACCOUNT: caffemate-migrate@${PROJECT_ID}.iam.gserviceaccount.com

steps:
  - id: build-backend-image
    name: gcr.io/cloud-builders/docker
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - --file
      - deploy/backend.Dockerfile
      - --tag
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_IMAGE_NAME}:${COMMIT_SHA}
      - .

  - id: push-backend-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_IMAGE_NAME}:${COMMIT_SHA}

  - id: update-migration-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - jobs
      - update
      - ${_MIGRATION_JOB_NAME}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_IMAGE_NAME}:${COMMIT_SHA}
      - --region=${_REGION}
      - --service-account=${_MIGRATION_SERVICE_ACCOUNT}
      - --command=caffemate-api
      - --args=migrate
      - --tasks=1
      - --max-retries=0
      - --task-timeout=10m
      - --update-labels=source-revision=${SHORT_SHA},managed-by=cloud-build
      - --quiet

  - id: run-migrations
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - jobs
      - execute
      - ${_MIGRATION_JOB_NAME}
      - --region=${_REGION}
      - --wait
      - --quiet

  - id: deploy-control-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_API_SERVICE_NAME}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_IMAGE_NAME}:${COMMIT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --service-account=${_API_RUNTIME_SERVICE_ACCOUNT}
      - --port=8080
      - --ingress=all
      - --update-labels=source-revision=${SHORT_SHA},managed-by=cloud-build
      - --quiet

  - id: deploy-worker
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -euo
      - pipefail
      - -c
      - |
        api_url="$$(gcloud run services describe '${_API_SERVICE_NAME}' \
          --region='${_REGION}' --format='value(status.url)')"
        test -n "$${api_url}"
        gcloud run deploy '${_WORKER_SERVICE_NAME}' \
          --image='${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_IMAGE_NAME}:${COMMIT_SHA}' \
          --region='${_REGION}' \
          --platform=managed \
          --service-account='${_WORKER_RUNTIME_SERVICE_ACCOUNT}' \
          --command=uvicorn \
          --args=worker.main:app,--host,0.0.0.0,--port,8080 \
          --port=8080 \
          --ingress=internal \
          --update-env-vars="CONTROL_API_URL=$${api_url},CONTROL_API_AUDIENCE=$${api_url}" \
          --update-labels='source-revision=${SHORT_SHA},managed-by=cloud-build' \
          --quiet

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_IMAGE_NAME}:${COMMIT_SHA}

options:
  dynamicSubstitutions: true
  logging: CLOUD_LOGGING_ONLY
