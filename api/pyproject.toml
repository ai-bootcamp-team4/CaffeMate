[project]
name = "caffemate-api"
version = "0.2.0"
description = "CaffeMate authoritative Control API"
requires-python = ">=3.12,<3.15"
dependencies = [
  "cloud-sql-python-connector[pg8000]>=1.18,<2",
  "fastapi>=0.116,<1",
  "firebase-admin>=7.1,<8",
  "google-cloud-pubsub>=2.31,<3",
  "google-auth>=2.40,<3",
  "httpx>=0.28,<1",
  "jsonschema[format]>=4.25,<5",
  "mcp==2.0.0",
  "pydantic>=2.11,<3",
  "pyjwt>=2.13,<3",
  "rfc8785>=0.1.4,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
caffemate-api = "app.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
  "testcontainers>=4.13,<5",
  "types-jsonschema>=4.25,<5",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = [".."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
  "firebase_admin",
  "firebase_admin.*",
  "google.cloud.pubsub_v1",
  "google.cloud.pubsub_v1.*",
]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
