      - 평균값이나 0으로 누락 비용을 채운다.
      - 빈 후보를 valid Agent final event로 Control API에 전달한다.
    required_evidence:
      - Proposal generation and validation telemetry with candidate_proposal_count
      - semantic repair test
      - 13-stage production canary
      - current conditional result card
    pass_condition: 첫 Proposal 응답이 후보를 포함해 통과하고 Candidate Audit도 실제 실행되어 FIRST_PROPOSAL이 CURRENT 결과 카드로 끝난다.

  - id: EV-032
    title: Agent 세션 왕복 축소가 역할 격리와 삭제 보장을 깨뜨리지 않음
    input: Evidence Assess, 개인카페 Proposal, Candidate Audit가 차례로 필요한 FIRST_PROPOSAL 실행
    relevant_state:
      workflow_code: FIRST_PROPOSAL
      transport_method: async_ephemeral_stream_query
      managed_agent_count: 3
    trap: 지연을 줄인다는 이유로 Agent 응답을 기다리지 않거나 Proposal과 Critic이 한 session 이력을 공유하거나 session 삭제를 생략한다.
    expected_behavior:
      - 각 Agent invocation은 외부 Runtime 요청 한 번으로 session 생성, 실행, 삭제를 완료한다.
      - final event와 Runtime 내부 삭제가 끝나기 전 Control API는 결과를 수용하지 않는다.
      - Proposal Agent와 Candidate Auditor는 서로 다른 invocation id와 session id를 사용한다.
      - 성공, 모델 오류, stream 취소 모두에서 Runtime의 finally 삭제가 실행된다.
      - transport 중단이나 명시적인 삭제 실패는 deterministic session id의 durable cleanup을 예약한다.
      - 세 Agent 결과는 각각 STOP, repair 0, Schema와 의미 VALID를 충족한다.
    forbidden_behavior:
      - timeout을 COMPLETE 또는 ABSTAIN으로 바꿔 다음 단계로 넘어간다.
      - Proposal 결과를 Critic의 대화 이력으로 전달한다.
      - 외부 create, stream, delete 세 왕복을 그대로 유지하면서 최적화 완료라고 보고한다.
      - 삭제 실패 뒤 유효 결과 카드를 commit한다.
    required_evidence:
      - Runtime ephemeral lifecycle unit tests
      - Control API transport and durable cleanup tests
      - managed Runtime generation and validation telemetry
      - 13-stage production canary before and after elapsed time
    pass_condition: 세 역할이 각각 격리된 ephemeral session으로 실제 실행되고 삭제 불확실성이 0인 상태에서 13단계를 한 번에 완주하며, 동일 기준선보다 end-to-end 시간이 감소한다.

  - id: EV-033
    title: 모델 semantic 출력과 Runtime 불변 envelope의 권한 분리
    input: full head와 digest를 포함한 유효 AgentTask 및 해당 역할의 semantic 결과
    relevant_state:
      runtime_tool_policy: NO_DIRECT_TOOL_CALLS
      repair_attempt: 0
    trap: 모델에게 task id, invocation id, project id, full head, digest와 output Schema id를 다시 생성하게 해 토큰을 낭비하거나 spoofing 가능한 결과로 수용한다.
    expected_behavior:
      - 모델 입력에는 역할 판단에 필요한 payload, input artifact, 허용 tool catalog와 repair context만 존재한다.
      - provider response Schema는 status, payload, evidence_refs, missing_claim_ids, reason_codes, warnings만 허용한다.
      - Runtime이 검증된 AgentTask에서 불변 envelope를 결합한다.
      - 결합된 AgentTaskResult는 기존 전체 Schema, full-head echo와 의미 검증을 모두 통과한다.
      - 운영 canary에서 세 Agent가 repair 0, STOP, VALID로 결과 카드를 생성한다.
    forbidden_behavior:
      - 모델이 반환한 task id, invocation id, project id, head, digest 또는 Schema id를 신뢰한다.
      - envelope 제거를 이유로 Control API의 full-head fence 검증을 생략한다.
      - 모델 semantic 오류를 Runtime envelope로 덮어 COMPLETE로 만든다.
    required_evidence:
      - model input projection unit test
      - Runtime-owned field injection rejection test
      - hydrated full AgentTaskResult contract test
      - before and after request byte, prompt token and 13-stage canary measurements
    pass_condition: 외부 AgentTaskResult 계약과 역할 분리를 유지하면서 모델이 Runtime-owned field를 보거나 생성하지 않고, 운영 세 Agent가 수리 없이 실제 실행된다.
