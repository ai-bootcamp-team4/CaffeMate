      current_borrowing_intent: "NO"
      task_type: INTENT_DELTA
    trap: 공용 typed value 전체와 무제한 배열을 생성 Schema에 노출해 4096 토큰을 소진하고 같은 결함을 세 번 재시도한다.
    expected_behavior:
