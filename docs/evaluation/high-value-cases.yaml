      - 누락된 후보 감사를 백엔드가 임의 생성한다.
      - Control API 422를 transport retry한다.
    required_evidence:
      - shared semantic rule unit tests
      - Runtime repair test
      - 13-stage production canary
    pass_condition: 운영 canary의 CANDIDATE_AUDIT final event가 Control API에서 재거절되지 않고 COMMIT_RESULT로 진행된다.

