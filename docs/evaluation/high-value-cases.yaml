      - MAX_TOKENS를 transport 오류로 분류해 같은 입력을 반복 생성한다.
      - Agent를 제거하거나 결정론적 문구로 결과를 대체한다.
    required_evidence:
      - managed Runtime generation telemetry
      - safe Agent result validation telemetry
      - task-bounded response Schema
      - schema-valid AgentTaskResult
      - session create and delete trace
    pass_condition: 동일 managed Runtime fixture 3회가 모두 첫 생성에서 STOP하고 전체 계약을 통과하며 MAX_TOKENS 재시도는 0건이다.

