    trap: 역할 이름이 Agent라는 이유만으로 모든 단계에 medium 이상 사고 수준과 실제 출력보다 큰 토큰 한도를 적용한다.
    expected_behavior:
      - Evidence Assess는 low 사고 수준과 최대 2048 출력 토큰을 사용한다.
      - Proposal과 Candidate Audit은 low 사고 수준과 최대 4096 출력 토큰을 사용한다.
      - 각 역할은 실제 모델 응답을 기다리고 Schema·echo·의미 검증을 통과한 뒤에만 다음 단계로 진행한다.
      - Proposal과 Candidate Audit는 서로 독립된 역할과 입력 계약을 유지한다.
